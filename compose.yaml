services:
  database:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: arrowstack
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in root .env}
      POSTGRES_DB: arrowstack
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arrowstack -d arrowstack"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgresql://arrowstack:${POSTGRES_PASSWORD}@database:5432/arrowstack
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in root .env}
      WEB_ORIGIN: http://127.0.0.1:8080
    command: ["sh", "-c", "npx prisma migrate deploy && node dist/server.js"]
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  postgres_data:
